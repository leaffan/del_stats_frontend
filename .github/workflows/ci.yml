name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tooling:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run repository checks
              run: pnpm check

            - name: Run linter (report only, does not fail the build)
              run: pnpm lint
              continue-on-error: true

    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch test fixture data
              env:
                  FIXTURE_DATA_URL: ${{ secrets.FIXTURE_DATA_URL }}
              run: |
                  if [ -z "$FIXTURE_DATA_URL" ]; then
                    echo "::warning::FIXTURE_DATA_URL is not set - data-dependent tests will skip themselves instead of running for real. See docs/ROADMAP.md."
                  else
                    curl -fsSL "$FIXTURE_DATA_URL" -o fixture-data.tar.gz
                    tar -xzf fixture-data.tar.gz
                    echo "Extracted $(find data -type f | wc -l) fixture files (expecting 76)"
                  fi

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Run end-to-end tests
              run: pnpm test
