name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tooling:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run repository checks
              run: pnpm check

            - name: Run linter (report only, does not fail the build)
              run: pnpm lint
              continue-on-error: true

    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch test fixture data
              env:
                  FIXTURE_DATA_URL: ${{ secrets.FIXTURE_DATA_URL }}
              run: |
                  if [ -z "$FIXTURE_DATA_URL" ]; then
                    echo "::error::FIXTURE_DATA_URL is not set, so the data-dependent tests cannot run for real. Repository secrets are not available to pull requests from forks, and Dependabot needs the secret under Settings > Secrets > Dependabot."
                    exit 1
                  fi
                  ARCHIVE=$(node -p "require('./fixture-manifest.json').archive")
                  echo "Fetching $ARCHIVE (named in fixture-manifest.json)"
                  curl -fsSL "${FIXTURE_DATA_URL%/}/$ARCHIVE" -o "$ARCHIVE"
                  tar -xzf "$ARCHIVE"
                  node scripts/verify-fixture.js

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Run end-to-end tests
              env:
                  REQUIRE_FIXTURE: '1'
              run: pnpm test
