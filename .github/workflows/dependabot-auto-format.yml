name: Dependabot Auto Format

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: dependabot-auto-format-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    format:
        if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: write
        runs-on: ubuntu-latest

        steps:
            - name: Check out pull request branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run formatter
              run: pnpm run format

            - name: Commit and push changes
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add -A
                    git commit -m "chore: auto-format dependabot update"
                    git push
                  else
                    echo "No formatting changes to commit."
                  fi
