<div class="container" data-ng-app="delStatsApp">

    <div class="alert alert-info main-bg shadow">
        <a href="#!"><b>Startseite</b></a> | <a href="#!/team_stats/{{ ctrl.defaultSeason }}"><b>Teamstatistiken</b></a> | <a href="#!/trivia"><b>Trivia</b></a>
    </div>

    <div class="alert alert-info main-bg shadow">
        <h2>DEL-Team-Trivia</h2>
    </div>

    <form>
        <div class="form-row mb-1">
            <div class="input-group col-6">
                <select class="form-control" data-ng-model="ctrl.categorySelect" data-ng-change="ctrl.changeCategory()">
                    <option data-ng-repeat="(key, category) in ctrl.categories" value="{{key}}">{{category.label_de}}</option>
                </select>
            </div>
            <div class="input-group col-3 pl-0" data-ng-if="ctrl.currentCategory()">
                <select class="form-control" data-ng-model="ctrl.seasonTypeSelect" data-ng-change="ctrl.changeSeasonType()">
                    <option data-ng-repeat="(key, seasonType) in ctrl.currentCategory().season_types" value="{{key}}">{{seasonType.label_de}}</option>
                </select>
            </div>
            <div class="input-group col-3 pl-0">
                <select class="form-control" data-ng-model="ctrl.teamSelect">
                    <option value="">alle Teams</option>
                    <option data-ng-repeat="team in ctrl.all_teams" value="{{team.abbr}}">{{team.full_name}}</option>
                </select>
            </div>
        </div>
    </form>

    <table class="table table-responsive-md table-striped table-bordered table-hover table-sm small shadow" data-ng-if="ctrl.currentSeasonType()">
        <thead table-header stats-cols="ctrl.currentSeasonType().columns" ctrl="ctrl" class="thead-light"></thead>
        <tbody>
            <tr data-ng-repeat="row in ctrl.trivia_data | filter:ctrl.teamFilter | orderBy:ctrl.sortConfig.sortCriteria:ctrl.sortConfig.sortDescending">
                <td data-ng-repeat="col in ctrl.currentSeasonType().columns" class="{{col.align == 'left' ? 'text-left' : col.align == 'center' ? 'text-center' : 'text-right'}}">{{ row[col.data_key] }}</td>
            </tr>
        </tbody>
    </table>

    <div class="alert alert-warning" data-ng-if="ctrl.trivia_data && ctrl.trivia_data.length === 0">
        Keine Daten für diese Auswahl vorhanden.
    </div>

</div>
